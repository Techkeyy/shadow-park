name: verify

on:
  push:
  pull_request:

jobs:
  scene:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scene
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: scene/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
